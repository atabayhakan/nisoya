name: Deploy

# main'e push olduğunda Hostinger VPS'e otomatik deploy.
# Gerekli GitHub Secrets:
#   SSH_HOST         -> 72.62.115.3
#   SSH_USER         -> root  (veya sudo'lu deploy kullanıcısı)
#   SSH_PRIVATE_KEY  -> deploy özel anahtarı (D:\nisoya-tools\deploy\nisoya_deploy içeriği)
#
# Tek seferlik sunucu hazırlığı (depo oluştuktan sonra):
#   cd /var/www/nisoya && git init && git remote add origin <REPO_URL> \
#     && git fetch origin && git checkout -f -b main origin/main

on:
  # main'e her push'ta VPS'e otomatik deploy. Kurulum 2026-07-04'te tamamlandı:
  # 3 secret (SSH_HOST/USER/PRIVATE_KEY) eklendi, sunucu git deposuna çevrildi
  # (repo deploy key ile), workflow_dispatch ile elle test başarılı oldu.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucuda deploy çalıştır
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # SSH bağlantı zaman aşımı 30s→60s: geçici ağ yavaşlığında deploy'un
          # "dial tcp: i/o timeout" ile yanlış yere düşmesini önler.
          timeout: 60s
          command_timeout: 15m
          script: |
            cd /var/www/nisoya
            # ÖNEMLİ: kodu BURADA güncelliyoruz, deploy.sh'ın İÇİNDE değil.
            # deploy.sh kendini güncellerse, bash script'i diskten satır satır
            # okuduğu için çalışan sürüm bozulur (kendini-değiştiren script
            # sorunu). Önce güncelle → deploy.sh güncel hale gelir → sonra bash
            # onu baştan (güncel) okur.
            #
            # `git pull` YERİNE fetch + hard reset: sunucudaki yerel değişiklikler
            # (ör. deploy.sh'ın `npm install` fallback'inin değiştirdiği
            # package-lock.json) pull'u "Your local changes would be overwritten"
            # ile BLOKLAMASIN diye — bu, PR #4-#7'nin sunucuya hiç ulaşmamasına
            # yol açmıştı. Deploy hedefi olduğundan tracked dosyaları main'e
            # zorla eşitlemek güvenli; .env/vendor/node_modules/storage/
            # public/build gitignore'lu olduğu için reset onlara DOKUNMAZ.
            git fetch origin main
            git reset --hard origin/main
            bash deploy/deploy.sh
