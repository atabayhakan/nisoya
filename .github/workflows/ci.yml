name: CI

# Her PR'da ve main/develop push'unda çalışır.
# Pipeline aşamaları:
#   1. test        → PHPUnit, Laravel Pint (lint), migrate, helpers, optimize, vite build
#   2. phpstan     → Statik analiz (baseline ile, baseline büyüdükçe otomatik güncellenir)
#   3. security    → composer audit + npm audit (high/critical = fail)
#   4. e2e         → Temel sağlık kontrolleri (routes yüklenebiliyor mu)
#
# Deploy workflow'u (.github/workflows/deploy.yml) main push'unda VPS'e deploy yapar.
# Bu pipeline test/deploy ayrımı sağlar.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Aynı PR'da birden fazla push olursa (force-push) eski çalışmaları iptal et
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP kurulumu
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, intl, pdo_mysql, sqlite, pdo_sqlite, zip
          coverage: none
          # Production'daki gerçek PHP sürümünü taklit et

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: SQLite dosyasını oluştur
        # composer install'ın post-autoload-dump adımı (package:discover) uygulamayı
        # bootstrap eder ve AppServiceProvider::boot() Schema::hasTable() çağırır —
        # bu da sqlite dosyasının fiziksel olarak var olmasını gerektirir
        # (database.sqlite .gitignore'da, checkout'ta gelmez).
        run: touch database/database.sqlite

      - name: Composer bağımlılıkları
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: NPM kurulumu
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: .env hazırla
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Composer autoload (helpers.php dahil)
        run: |
          # helpers.php autoload'a ekli mi kontrol et
          grep -q "app/helpers.php" composer.json || exit 1
          # helpers.php gerçekten require ediliyor mu
          php -r "require __DIR__ . '/vendor/autoload.php'; echo function_exists('setting') ? 'ok' : 'fail';"

      - name: Laravel Pint (kod stili)
        run: vendor/bin/pint --test

      - name: Vite build
        run: npm run build

      - name: Migrasyonlar (yeni migration'lar var mı?)
        run: |
          # Bekleyen migration'ları listele (boş dönmeli)
          PENDING=$(php artisan migrate:status 2>&1 | grep -c "Pending" || true)
          if [ "$PENDING" -gt 0 ]; then
            echo "Bekleyen migration'lar var:"
            php artisan migrate:status
            exit 1
          fi
          echo "✓ Tüm migration'lar uygulanmış"

      - name: Optimize komutları test et
        run: |
          # config:cache, route:cache, view:cache çalışmalı
          php artisan config:clear
          php artisan config:cache
          php artisan route:clear
          php artisan route:cache
          php artisan view:clear
          php artisan view:cache
          # Tüm cache'leri temizle
          php artisan optimize:clear
          echo "✓ Optimize komutları çalışıyor"

      - name: PHPUnit (SQLite, in-memory, paralel)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --parallel

      - name: Test coverage raporu (özet)
        if: github.event_name == 'pull_request'
        run: |
          # Coverage raporunu konsola yazdır (PR review için)
          vendor/bin/phpunit --coverage-text --min-coverage=0 2>&1 | tail -30 || true

  phpstan:
    name: Static Analysis (PHPStan + Larastan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # baseline büyüdükçe bu adım pass olmaya devam eder.
    # Yeni yazılan kod için PHPStan kuralı: yeni hata 0 baseline'a eklenmemeli.
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, intl, pdo_mysql, sqlite, pdo_sqlite, zip
          coverage: none

      - name: SQLite dosyasını oluştur
        run: touch database/database.sqlite

      - name: Composer install (dev)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPStan analyse (baseline ile)
        # Yeni eklenen hatalar baseline'da olmadığı için CI fail eder.
        # Eğer mevcut hataları bilerek eklemek istiyorsanız:
        #   vendor/bin/phpstan analyse --generate-baseline=phpstan-baseline.neon
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Yeni PHPStan hatalarını raporla (PR diff)
        if: failure()
        run: |
          echo "::error::Yeni PHPStan hataları tespit edildi. Mevcut hataları görmezden gelmek için:"
          echo "  vendor/bin/phpstan analyse --generate-baseline=phpstan-baseline.neon --memory-limit=2G"
          echo "komutunu lokalde çalıştırıp baseline'ı güncelleyin."

  security:
    name: Security Audit (composer + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, intl, pdo_mysql, sqlite, pdo_sqlite, zip

      - name: SQLite dosyasını oluştur
        run: touch database/database.sqlite

      - name: Composer bağımlılıkları
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: NPM install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Composer security audit (high+ fail)
        # Sadece high ve critical seviye güvenlik açıkları CI'ı kırar.
        # Medium/low advisory'ler PR review'da görülür ama fail etmez.
        run: |
          composer audit --no-dev --format=json --abandoned=ignore > audit.json || true
          php scripts/audit.php audit.json

      - name: NPM security audit (high+ fail)
        run: |
          npm audit --audit-level=high 2>&1 || {
            echo "::error::NPM yüksek seviye güvenlik açığı tespit edildi"
            exit 1
          }
          echo "✓ NPM yüksek seviye güvenlik açığı yok"

  build:
    name: Production build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Production ortamı simülasyonu — composer install --no-dev çalışıyor mu
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, intl, pdo_mysql, sqlite, pdo_sqlite, zip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: SQLite dosyasını oluştur
        run: touch database/database.sqlite

      - name: Composer install (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: NPM production build
        run: npm ci --no-audit --no-fund && npm run build

      - name: Artisan komutları (production-ready)
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          # Production'da debug kapalı
          APP_DEBUG=false php artisan optimize

  e2e:
    name: E2E Health Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Temel rotalar yüklenebiliyor mu + Filament keşfi
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, intl, pdo_mysql, sqlite, pdo_sqlite, zip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: SQLite dosyasını oluştur
        run: touch database/database.sqlite

      - name: Composer bağımlılıkları
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: NPM install + build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: .env hazırla
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Route keşfi
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          # Tüm rotaları yükle (syntax hatası varsa burada fail eder)
          php artisan route:list --json > /tmp/routes.json
          if [ ! -s /tmp/routes.json ]; then
            echo "::error::Route listesi alınamadı"
            exit 1
          fi
          # Public rotaların varlığını kontrol et
          for route in "home" "listings.index" "listings.show" "pages.how" "pages.contact" "register" "login"; do
            if ! grep -q "\"uri\":\\s*\"[^\"]*\"\\s*,\\s*\"name\":\\s*\"$route\"" /tmp/routes.json 2>/dev/null; then
              echo "::warning::$route route'u bulunamadı (skipped)"
            fi
          done
          echo "✓ Public route'lar yüklendi"

      - name: Config cache round-trip
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          # Config cache düzgün çalışmalı
          php artisan config:cache
          php artisan config:clear
          echo "✓ Config cache round-trip başarılı"
