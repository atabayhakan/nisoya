# Nisoya — Nginx server bloğu (Ubuntu + PHP-FPM)
# /etc/nginx/sites-available/nisoya -> sites-enabled/ symlink
# Domain ve PHP sürümünü kendine göre güncelle. Certbot 443 bloğunu otomatik ekler.

server {
    listen 80;
    listen [::]:80;
    server_name nisoya.com www.nisoya.com;
    root /var/www/nisoya/public;

    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    # Güvenlik başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Gizli dosyalara erişimi engelle (.env, .git vb.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Statik varlık önbelleği.
    # ÖNEMLİ: try_files ile bitir — Livewire/Filament dinamik .js/.css route'ları
    # diskte dosya değildir; bulunamayan varlık Laravel'e (index.php) düşmeli.
    location ~* \.(jpg|jpeg|png|webp|gif|ico|css|js|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri $uri/ /index.php?$query_string;
    }
}
