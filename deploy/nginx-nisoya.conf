# Nisoya — Nginx server bloğu (Ubuntu + PHP-FPM)
# /etc/nginx/sites-available/nisoya -> sites-enabled/ symlink
# Domain ve PHP sürümünü kendine göre güncelle. Certbot 443 bloğunu otomatik ekler.

server {
    listen 80;
    listen [::]:80;
    # YALNIZ kanonik alan adı. www ayrı bir blokta 301 ile buraya yönlendirilir
    # (dosyanın sonuna bak) — iki alan adının da aynı içeriği sunması iki soruna
    # yol açıyordu: yönetim panelindeki dosya isteklerinin çapraz köken olması
    # ve arama motorunda yinelenen içerik.
    server_name nisoya.com;
    root /var/www/nisoya/public;

    index index.php;
    charset utf-8;
    # İlan başına en fazla 8 görsel × 4MB (uygulama limiti) — PHP post_max_size ile eşleşmeli.
    client_max_body_size 40M;

    # ── Güvenlik başlıkları ──
    # NOT: Certbot 443 (HTTPS) dinleyicisini BU server bloğuna ekler, dolayısıyla
    # bu başlıklar HTTPS yanıtlarında da geçerli olur. HSTS yalnızca HTTPS
    # üzerinden anlamlıdır (tarayıcı HTTP'de yok sayar). max-age=15768000 (6 ay);
    # includeSubDomains/preload BİLİNÇLİ olarak YOK — geri dönülebilir kalsın
    # (SSL sorununda kilitlenme riskini sınırlar). Canlıda 2026-07-18'de aktive
    # edildi (aktif dosya sites-enabled/nisoya idi — sites-available symlink değil,
    # ayrı kopyaydı; ikisi de güncellendi).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Bu satır 2026-08-13'te DÜZELTİLDİ — eski hâli sitenin KENDİ
    # özelliklerini kapatıyordu.
    #
    # Boş parantez "hiç kimseye izin yok" demek, kendi kaynağımıza bile.
    # Tarayıcıya soruldu (document.featurePolicy.allowsFeature): geolocation,
    # microphone ve camera üçü de `false` dönüyordu. Oysa:
    #   - Sesle ilan (resources/js/app.js, SpeechRecognition) MİKROFON ister.
    #     Düğme görünüyordu ama basınca hiçbir şey olmuyordu.
    #   - Acil paneli ve mesaj ekranı KONUM ister; hep yedeğe düşüyordu.
    #
    # self = yalnız kendi sayfamız; üçüncü taraf iframe'lere yine kapalı.
    # camera=() bilerek KAPALI kalıyor: kamerayı getUserMedia ile kullanan
    # hiçbir yer yok (hızlı ilan `<input type="file" capture>` kullanıyor ve
    # o bu politikaya tabi değil). En az yetki kuralı.
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=()" always;
    add_header Strict-Transport-Security "max-age=15768000" always;

    # ── Sıkıştırma ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ── Rate limiting notu (2026-08-13'te KALDIRILDI) ──
    #
    # Burada iki `limit_req_zone` satırı vardı ve bu dosyayı UYGULANAMAZ
    # yapıyordu: nginx'te `limit_req_zone` yalnız `http` bağlamında geçerli,
    # `server` içinde değil. Yani DEPLOY.md'deki "bu dosyayı sites-available'a
    # kopyala" adımı `nginx -t` aşamasında düşerdi. Canlı yapılandırmanın neden
    # ayrı, elle bakılan bir kopya olduğu ve depoyla senkron kalmadığı
    # muhtemelen buradan geliyor.
    #
    # Üstelik bölgeler hiçbir yerde KULLANILMIYORDU (`limit_req` yönergesi yok),
    # yani hiçbir koruma sağlamıyorlardı. Uygulama katmanında zaten gerçek hız
    # sınırları var (bootstrap/app.php → RateLimiter::for('login'), 'register',
    # 'message-send', 'ai-listing-draft', 'temsili-gorsel', 'ilan-cevirisi'…).
    #
    # Nginx seviyesinde sınır istenirse: bölgeler `http` bağlamına
    # (/etc/nginx/nginx.conf ya da conf.d/ altında bir dosyaya) tanımlanmalı,
    # sonra burada `limit_req zone=login burst=5 nodelay;` ile KULLANILMALI.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Statik dosyalar (favicon, robots) ──
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── Health check (uptime monitor'ler için) ──
    location = /health {
        access_log off;
        # Rate limit uygulanmaz (monitor'ler sık istek atar)
        try_files $uri /index.php?$query_string;
    }

    # ── Service worker (PWA) — önbelleğe alınmaz, güncellemeler hemen yansır ──
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    # Manifest (PWA) — uzun süreli cache (versiyonlu)
    location = /manifest.webmanifest {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Manifest icons (PWA) ──
    location ~* ^/icons/.*\.(png|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    error_page 404 /index.php;

    # ── Kullanıcı yüklemeleri: /storage altında PHP ASLA yürütülmez (RCE koruması) ──
    # "^~" öneki, aşağıdaki "\.php$" regex'inden ÖNCE eşleşir; böylece
    # public/storage sembolik bağı üzerinden yüklenmiş bir betik dosyası
    # yorumlanmaz. Uygulama katmanında da uzantı beyaz listesi vardır
    # (MedyaKutuphanesi::uploadFiles) — bu ikinci savunma hattıdır.
    location ^~ /storage/ {
        location ~* \.(php\d*|phtml|phar|pht|cgi|pl|py|sh|htaccess)$ {
            deny all;
        }

        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # PHP-FPM performans
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ── Gizli dosyalara erişimi engelle (.env, .git vb.) ──
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ── Statik varlık önbelleği (storage/app/public + public/build) ──
    # AVIF, WebP, JPEG vb. modern formatlar için uzun cache.
    # ÖNEMLİ: try_files ile bitir — Filament/Livewire dinamik route'ları diskte
    # dosya değildir; bulunamayan varlık Laravel'e (index.php) düşmeli.
    location ~* \.(jpg|jpeg|png|webp|avif|gif|ico|css|js|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";

        # SIKIŞTIRMA BURADA AÇIKÇA TEKRARLANIYOR (2026-08-13).
        #
        # Sunucu bloğundaki `gzip on` bu konuma miras kalır, ama CANLIDA
        # ÖLÇÜLDÜ ki kalmıyor: HTML gzip'liydi, CSS ve JS ÇIPLAKTI.
        #   app-*.css → 211.538 bayt, Content-Encoding başlığı YOK
        #   app-*.js  →  81.447 bayt, Content-Encoding başlığı YOK
        # (Canlı nginx dosyası depodakiyle senkron değil; bkz. DEPLOY.md.)
        #
        # Hedef kitle ağırlıkla mobil ve yurt dışında; 290 KB'lık çıplak
        # metin varlığı sıkıştırıldığında ~40 KB'a iniyor. Bu satırlar,
        # yapılandırma yine sapsa bile konumun kendi başına doğru davranmasını
        # sağlar.
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Gzip varyantları için vary header kontrolü (ileride) ──
    location ~* \.css$ {
        add_header Vary "Accept-Encoding";
    }
    location ~* \.js$ {
        add_header Vary "Accept-Encoding";
    }
}

# ---------------------------------------------------------------------------
# www → kanonik (www'suz) yönlendirmesi — CANLIDA 2026-08-09'da eklendi.
#
# NEDEN: iki alan adı da AYNI içeriği sunuyordu ve bunun iki bedeli vardı.
#
#   1. Yönetim paneli `www.` ile açıldığında Filament'in "kayıtlı dosyanın
#      boyutunu getir" isteği ÇAPRAZ KÖKEN oluyordu (APP_URL www'suz) ve
#      statik dosyalarda CORS başlığı olmadığı için düşüyordu. Sonuç: görsel
#      yükleme alanı sonsuza dek "Boyut hesaplanıyor"da kalıyordu. Ölçüldü:
#      aynı sayfadan `fetch()` "Failed to fetch" verirken `<img>` yükleniyordu
#      — belirtinin "hem çalışıyor hem çalışmıyor" görünmesi bu yüzdendi.
#
#   2. Arama motoru tarafında yinelenen içerik. sitemap.xml zaten www'suz
#      adresleri bildiriyor, yani kanonik taraf baştan belliydi.
#
# 301 (kalıcı) bilinçli: geçici olsaydı arama motoru iki adresi de tutmaya
# devam ederdi.
#
# ŞART: sertifika İKİ alan adını da kapsamalı (`certbot certificates` →
# "Domains: nisoya.com www.nisoya.com"). Kapsamasaydı TLS el sıkışması
# yönlendirmeden ÖNCE düşer ve ziyaretçi hata sayfası görürdü.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nisoya.com;

    ssl_certificate /etc/letsencrypt/live/nisoya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nisoya.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nisoya.com$request_uri;
}
