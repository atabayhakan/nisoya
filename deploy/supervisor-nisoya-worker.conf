; Nisoya — Kuyruk işçileri
; /etc/supervisor/conf.d/nisoya-worker.conf
; Sonra: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start nisoya-worker:*

; ── E-posta / bildirim worker'ı (Laravel queue) ──
; DEĞİŞMEZ: --timeout, config/queue.php'deki retry_after'dan (180) KÜÇÜK
; kalmalı. Tersi durumda kuyruk, hâlâ çalışan işi ikinci kez salıverir ve
; e-posta bildirimleri ÇİFT gider (bekçi testi: KuyrukDegismeziTest).
; Not (2026-08-02): canlıdaki kopya --timeout'suz koşuyor (varsayılan 60) —
; o da değişmezi sağlar; bu şablon yeniden kurulumda kullanılırsa 120 doğru.
[program:nisoya-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/nisoya/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/nisoya/storage/logs/worker.log
stopwaitsecs=3600
priority=10

; ── Zamanlayıcı worker'ı (cron) ──
; schedule:run her dakika çalışır. reverse-geocode gibi uzun süren
; görevler bu worker'da çalıştırılır.
[program:nisoya-schedule]
process_name=%(program_name)s_%(process_num)02d
command=/bin/bash -c "while true; do php /var/www/nisoya/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/nisoya/storage/logs/schedule.log
stopwaitsecs=10
priority=20
