; Nisoya — Kuyruk işçisi (e-posta/bildirim arka plan işleri)
; /etc/supervisor/conf.d/nisoya-worker.conf
; Sonra: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start nisoya-worker:*

[program:nisoya-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/nisoya/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/nisoya/storage/logs/worker.log
stopwaitsecs=3600
